#----------------------------
### 3. Configurations for VAE
#----------------------------
experiment_name: "vae_mnist_experiment"
seed: 42

data:
  dataset: "MNIST"
  batch_size: 128
  num_workers: 4
  data_dir: "./data/raw"

model:
  latent_dim: 32
  in_channels: 1
  hidden_dims: [32, 64, 128, 256]
  beta: 1.0

training:
  epochs: 50
  learning_rate: 0.001
  device: "cuda"
  save_dir: "./results/checkpoints"
  log_interval: 100
